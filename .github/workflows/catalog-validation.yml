name: Catalog Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check "PyYAML>=6.0" "jsonschema>=4.18"

      - name: Validate portable plugin manifest (Agent Plugins 1.0.0)
        run: python3 scripts/validate_plugin_manifest.py

      - name: Validate catalog structure and provenance
        run: python3 scripts/validate_catalog.py

      - name: Check OpenAI interface metadata is current
        run: python3 scripts/sync_openai_yaml.py --check

      - name: Audit description overlap across clusters
        run: python3 scripts/routing_audit.py

      - name: Audit owned-skill trigger routing
        run: python3 scripts/trigger_audit.py

      - name: Compile Python helpers
        run: python3 -m compileall -q scripts skills
