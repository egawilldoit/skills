name: Catalog Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  # Exact PR head: the commit actually proposed for merge is checked out
  # and validated. This is the only job that can certify the head itself.
  validate-head:
    name: validate-head (exact PR head)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prove the executed checkout is the PR head
        run: |
          python3 scripts/assert_checkout_sha.py \
            --expected "${{ github.event.pull_request.head.sha }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --event pull_request \
            --mode exact-head

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run catalog gates (HEAD_CERTIFIED)
        run: |
          python3 scripts/validate_plugin_manifest.py
          python3 scripts/validate_catalog.py
          python3 scripts/sync_openai_yaml.py --check
          python3 scripts/sync_operating_contract.py --check
          python3 scripts/routing_audit.py
          python3 scripts/trigger_audit.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

  # Synthetic merge result: proves the proposed head also validates when
  # merged with the current base. Executed SHA is expected to differ from
  # the PR head; this is MERGE_RESULT_CERTIFIED, not exact-head evidence.
  validate-merge:
    name: validate-merge (synthetic merge result)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out the PR merge result
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prove the executed checkout is the merge result, not the head
        run: |
          python3 scripts/assert_checkout_sha.py \
            --expected "${{ github.event.pull_request.head.sha }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --event pull_request \
            --mode merge-result
          echo "---"
          echo "PR HEAD SHA:      ${{ github.event.pull_request.head.sha }}"
          echo "BASE SHA:         ${{ github.event.pull_request.base.sha }}"
          echo "EXECUTED SHA (merge result): $(git rev-parse HEAD)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run catalog gates (MERGE_RESULT_CERTIFIED)
        run: |
          python3 scripts/validate_plugin_manifest.py
          python3 scripts/validate_catalog.py
          python3 scripts/sync_openai_yaml.py --check
          python3 scripts/sync_operating_contract.py --check
          python3 scripts/routing_audit.py
          python3 scripts/trigger_audit.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

  # Pushes to main validate the exact pushed SHA.
  validate-main:
    name: validate-main (pushed SHA)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prove the executed checkout is the pushed SHA
        run: |
          python3 scripts/assert_checkout_sha.py \
            --expected "${{ github.sha }}" \
            --event push \
            --mode exact-head

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run catalog gates
        run: |
          python3 scripts/validate_plugin_manifest.py
          python3 scripts/validate_catalog.py
          python3 scripts/sync_openai_yaml.py --check
          python3 scripts/sync_operating_contract.py --check
          python3 scripts/routing_audit.py
          python3 scripts/trigger_audit.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
